<%
  # R5 cell stores are fixed deployment bindings. The connection key is selected by the
  # process configuration before Rails boots; no request, host or token value participates in
  # this lookup. The current local completion scope provisions the three Governance RP cells below.
  rp_cells = [
    { connection: "rp_base_app", env_prefix: "RP_BASE_APP", database: "development_rp_base_app_db", client_id: "base-app-ww" },
    { connection: "rp_base_org", env_prefix: "RP_BASE_ORG", database: "development_rp_base_org_db", client_id: "base-org-ww" },
    { connection: "rp_tech_org", env_prefix: "RP_TECH_ORG", database: "development_rp_tech_org_db", client_id: "tech-org-ww" },
  ].map do |cell|
    cell.merge(
      migrations_path: "db/#{cell.fetch(:connection)}_migrate",
      schema_dump: "#{cell.fetch(:connection)}_structure.sql",
      test_database: cell.fetch(:database).sub("development_", "test_"),
    ).freeze
  end.freeze
%>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 32 } %>
  port: 5432
  timeout: 30000
  # Session settings are applied only from `variables:`; top-level keys were ignored (D-142).
  variables:
    lock_timeout: 2s
    # Raised from 2s so background jobs (e.g. RetentionPurgeJob batch deletes) are not
    # killed mid-statement. Web requests are additionally bounded by rack-timeout (10s).
    statement_timeout: 15s
  advisory_locks: false
test_default: &test_default
  !!merge <<: *default
  # The committed-transaction concurrency tests retain the test thread's lease
  # while two worker threads use independent connections.
  pool: 3
  # Fixed Dev Container contract (compose.yaml `primary`); test databases are never configured
  # from the environment, so a stray exported variable cannot redirect a destructive preparation.
  host: primary
  username: root
  password: development
  timeout: 20000
  prepared_statements: false
  advisory_locks: true
  variables:
    lock_timeout: 2s
    statement_timeout: 10s
    max_parallel_workers: 0
    max_parallel_workers_per_gather: 0
    max_parallel_maintenance_workers: 0
    jit: off
development_default: &development_default
  !!merge <<: *default
  pool: 2
  # Fixed Dev Container contract (compose.yaml `primary` and `replica` services, non-secret local
  # login). Development runs only inside the Dev Container (user decision 2026-10-19).
  username: root
  password: development
development:
  app_zenith:
    !!merge <<: *development_default
    database: development_app_zenith_db
    host: primary
    migrations_paths:
      - db/app_principals_migrate
      - db/app_zenith_migrate
    schema_dump: app_zenith_structure.sql
  app_zenith_replica:
    !!merge <<: *development_default
    replica: true
    database: development_app_zenith_db
    host: replica
    migrations_paths:
      - db/app_principals_migrate
      - db/app_zenith_migrate
    schema_dump: app_zenith_structure.sql
  org_zenith:
    !!merge <<: *development_default
    database: development_org_zenith_db
    host: primary
    migrations_paths:
      - db/org_principals_migrate
      - db/org_zenith_migrate
    schema_dump: org_zenith_structure.sql
  org_zenith_replica:
    !!merge <<: *development_default
    replica: true
    database: development_org_zenith_db
    host: replica
    migrations_paths:
      - db/org_principals_migrate
      - db/org_zenith_migrate
    schema_dump: org_zenith_structure.sql
  app_setting:
    !!merge <<: *development_default
    database: development_app_setting_db
    host: primary
    migrations_paths: db/app_settings_migrate
    schema_dump: app_setting_structure.sql
    connect_timeout: 2
  app_setting_replica:
    !!merge <<: *development_default
    replica: true
    database: development_app_setting_db
    host: replica
    migrations_paths: db/app_settings_migrate
    schema_dump: app_setting_structure.sql
    connect_timeout: 2
  org_setting:
    !!merge <<: *development_default
    database: development_org_setting_db
    host: primary
    migrations_paths: db/org_settings_migrate
    schema_dump: org_setting_structure.sql
  org_setting_replica:
    !!merge <<: *development_default
    replica: true
    database: development_org_setting_db
    host: replica
    migrations_paths: db/org_settings_migrate
    schema_dump: org_setting_structure.sql
  com_setting:
    !!merge <<: *development_default
    database: development_com_setting_db
    host: primary
    migrations_paths: db/com_settings_migrate
    schema_dump: com_setting_structure.sql
  com_setting_replica:
    !!merge <<: *development_default
    replica: true
    database: development_com_setting_db
    host: replica
    migrations_paths: db/com_settings_migrate
    schema_dump: com_setting_structure.sql
<% rp_cells.each do |cell| %>
  <%= cell.fetch(:connection) %>:
    !!merge <<: *development_default
    database: <%= cell.fetch(:database) %>
    host: primary
    migrations_paths: <%= cell.fetch(:migrations_path) %>
    schema_dump: <%= cell.fetch(:schema_dump) %>
  <%= cell.fetch(:connection) %>_replica:
    !!merge <<: *development_default
    replica: true
    database: <%= cell.fetch(:database) %>
    host: replica
    migrations_paths: <%= cell.fetch(:migrations_path) %>
    schema_dump: <%= cell.fetch(:schema_dump) %>
<% end %>
  app_signal:
    !!merge <<: *development_default
    database: development_app_signal_db
    host: primary
    migrations_paths: db/app_signals_migrate
  app_signal_replica:
    !!merge <<: *development_default
    replica: true
    database: development_app_signal_db
    host: replica
    migrations_paths: db/app_signals_migrate
  org_signal:
    !!merge <<: *development_default
    database: development_org_signal_db
    host: primary
    migrations_paths: db/org_signals_migrate
  org_signal_replica:
    !!merge <<: *development_default
    replica: true
    database: development_org_signal_db
    host: replica
    migrations_paths: db/org_signals_migrate
  queue:
    !!merge <<: *development_default
    pool: 5
    database: development_queue_db
    host: primary
    migrations_paths: db/queues_migrate
  storage:
    !!merge <<: *development_default
    database: development_storage_db
    host: primary
    migrations_paths: db/storages_migrate
  storage_replica:
    !!merge <<: *development_default
    replica: true
    database: development_storage_db
    host: replica
    migrations_paths: db/storages_migrate
  occurrence:
    !!merge <<: *development_default
    database: development_occurrence_db
    host: primary
    migrations_paths: db/occurrences_migrate
  occurrence_replica:
    !!merge <<: *development_default
    replica: true
    database: development_occurrence_db
    host: replica
    migrations_paths: db/occurrences_migrate
  chronicle:
    !!merge <<: *development_default
    database: development_chronicle_db
    host: primary
    migrations_paths: db/chronicle_migrate
    schema_dump: chronicle_structure.sql
  chronicle_replica:
    !!merge <<: *development_default
    replica: true
    database: development_chronicle_db
    host: replica
    migrations_paths: db/chronicle_migrate
    schema_dump: chronicle_structure.sql
  avatar:
    !!merge <<: *development_default
    database: development_avatar_db
    host: primary
    migrations_paths: db/avatars_migrate
  avatar_replica:
    !!merge <<: *development_default
    replica: true
    database: development_avatar_db
    host: replica
    migrations_paths: db/avatars_migrate
  # Rails default database. Durable, low-frequency, application-wide configuration
  # (currently Flipper). Deliberately has no replica: a flag is read immediately
  # after it is toggled, and replication lag would surface as a flip that "did not apply".
  primary:
    !!merge <<: *development_default
    database: development_primary_db
    host: primary
    migrations_paths: db/migrate
# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
