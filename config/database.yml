  <%= cell.fetch(:connection) %>:
    !!merge <<: *test_default
    database: <%= cell.fetch(:test_database) %>
    migrations_paths: <%= cell.fetch(:migrations_path) %>
  <%= cell.fetch(:connection) %>_replica:
    !!merge <<: *test_default
    replica: true
    database: <%= cell.fetch(:test_database).sub("_db", "_replica_db") %>
    migrations_paths: <%= cell.fetch(:migrations_path) %>
    schema_dump: <%= cell.fetch(:schema_dump) %>
<% end %>
  app_signal:
    !!merge <<: *test_default
    database: test_app_signal_db
    migrations_paths: db/app_signals_migrate
  app_signal_replica:
    !!merge <<: *test_default
    replica: true
    database: test_app_signal_replica_db
