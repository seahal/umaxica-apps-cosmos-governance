# Test intentionally has no recurring tasks. The normal test adapter never
# starts a scheduler; development and production list the same business work
# explicitly so a local worker does not silently exercise a different set.

development:
  contact_audit_delivery:
    class: ContactAuditDeliveryJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes
  passkey_audit_delivery:
    class: PasskeyAuditDeliveryJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes
  step_up_audit_delivery:
    class: StepUpAuditDeliveryJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every minute
  step_up_dispatch_recovery:
    class: RpStepUpDispatchRecoveryJob
    queue: retention
    priority: 50
    args: []
    schedule: every minute
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  retention_purge:
    class: RetentionPurgeJob
    queue: retention
    priority: 50
    args:
      - batch_size: 500
    schedule: every 15 minutes
  processor_erasure_notification_retry:
    class: ProcessorErasureNotificationRetryJob
    queue: retention
    priority: 50
    args:
      - batch_size: 100
    schedule: every 15 minutes
  enforcement_expiry:
    class: EnforcementExpiryJob
    queue: retention
    priority: 50
    args:
      - batch_size: 200
    schedule: every 15 minutes
  enforcement_reconciliation:
    class: EnforcementReconciliationJob
    queue: retention
    priority: 50
    args:
      - batch_size: 200
    schedule: every 15 minutes
test: {}

production:
  contact_audit_delivery:
    class: ContactAuditDeliveryJob
    queue: retention
